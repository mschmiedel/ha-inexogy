name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: |
          manifest=$(jq -r .version custom_components/inexogy/manifest.json)
          if [ "v${manifest}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest}"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.3 = release; v1.2.3a1 / b1 / rc1 = pre-release (HACS shows it only
          # to users who enabled beta versions). Anything else is rejected.
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=""
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            prerelease="--prerelease"
          else
            echo "::error::Tag ${GITHUB_REF_NAME} is neither vX.Y.Z nor vX.Y.Z(a|b|rc)N"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes ${prerelease}
